# Generated by tmux.app Config Generator
# https://tmux.app/config-generator/

# ── Prefix Key ──────────────────────────
# Default prefix: Ctrl+b (no change needed)

# ── General Settings ─────────────────────
set -g mouse on
set -g history-limit 10000
set -g base-index 0
setw -g pane-base-index 0
set -g default-command "${SHELL}"

# ── Status Bar ────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-left " #S "
set -g status-right " %H:%M %d-%b "

# ── Terminal Colors ──────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Theme (via TPM) ──────────────────────
# Nord Theme
set -g @plugin 'nordtheme/tmux'

# ── TPM Plugin Manager ───────────────────
# Install TPM first: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Keep the run line at the very bottom of this file.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
run '~/.tmux/plugins/tpm/tpm'
